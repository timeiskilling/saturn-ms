[package]
name = "jito_fee_service"
version = "0.1.0"
edition = "2024"

[dependencies]
rustls = "0.22"
futures-util = "0.3"
tokio-tungstenite = { version = "0.21", features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.45.1", features = ["full", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
redis = { version = "0.32.4", features = ["tokio-comp", "json"] } 