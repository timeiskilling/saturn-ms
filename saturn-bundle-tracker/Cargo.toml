[package]
name = "saturn-bundle-tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["http2", "tokio", "macros"] }
uuid = { version = "1.21.0", features = ["v4"] }
tokio = { version = "1.47.1", features = ["full", "macros"] }
async-trait = "0.1.89"
jito-sdk-rust = "0.3.2"
dashmap = "6.1.0"
jupiter_trader_data = {path = "../jupiter_trader_data"}
saturn_errors = { path = "../saturn_errors" }
common = { path = "../common" }
redis = { version = "1.0", features = ["tokio-comp", "json", "sentinel"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12.24", features = ["json"] }
governor = "0.10.2"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace", "cors"]}
solana-sdk = "2.3.1"
ahash = "0.8.12"
anyhow = "1.0"
chrono = { version = "0.4.41", features = ["serde"] }
bincode = "1.3.3"
base64 = "0.22.0"
