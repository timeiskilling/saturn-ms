# -----------------------------------------------------------------------------
# Redis Sentinel Cluster for Saturn Bundle Status Service
# -----------------------------------------------------------------------------
# Subnet: 10.0.1.0/24
# Master: 10.0.1.10
# Replica: 10.0.1.11
# Sentinels: 10.0.1.1, 10.0.1.2, 10.0.1.3
# -----------------------------------------------------------------------------

networks:
  bundle_status_net:
    ipam:
      driver: default
      config:
        - subnet: "10.0.1.0/24"
          gateway: "10.0.1.254"

services:
  redis-master:
    image: bitnami/redis:latest
    container_name: status-redis-master
    environment:
      - REDIS_REPLICATION_MODE=master
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      bundle_status_net:
        ipv4_address: 10.0.1.10
    ports:
      - "6382:6379"

  redis-replica:
    image: bitnami/redis:latest
    container_name: status-redis-replica
    environment:
      - REDIS_REPLICATION_MODE=slave
      - REDIS_MASTER_HOST=10.0.1.10
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      bundle_status_net:
        ipv4_address: 10.0.1.11
    depends_on:
      - redis-master

  redis-sentinel-1:
    image: bitnami/redis-sentinel:latest
    container_name: status-sentinel-1
    environment:
      - REDIS_MASTER_HOST=10.0.1.10
      - REDIS_MASTER_SET=mymaster
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=5000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=10000
    networks:
      bundle_status_net:
        ipv4_address: 10.0.1.1
    ports:
      - "26382:26379"
    depends_on:
      - redis-master
      - redis-replica

  redis-sentinel-2:
    image: bitnami/redis-sentinel:latest
    container_name: status-sentinel-2
    environment:
      - REDIS_MASTER_HOST=10.0.1.10
      - REDIS_MASTER_SET=mymaster
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=5000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=10000
    networks:
      bundle_status_net:
        ipv4_address: 10.0.1.2
    ports:
      - "26383:26379"
    depends_on:
      - redis-master
      - redis-replica

  redis-sentinel-3:
    image: bitnami/redis-sentinel:latest
    container_name: status-sentinel-3
    environment:
      - REDIS_MASTER_HOST=10.0.1.10
      - REDIS_MASTER_SET=mymaster
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=5000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=10000
    networks:
      bundle_status_net:
        ipv4_address: 10.0.1.3
    ports:
      - "26384:26379"
    depends_on:
      - redis-master
      - redis-replica

  bundle-status-service:
    build:
      context: ..
      dockerfile: bundle_status_service/Dockerfile
    container_name: bundle-status-service
    networks:
      bundle_status_net:
        ipv4_address: 10.0.1.30
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      - REDIS_SENTINEL_URLS=redis://10.0.1.1:26379,redis://10.0.1.2:26379,redis://10.0.1.3:26379
      - REDIS_MASTER_SET=mymaster
    depends_on:
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3
    restart: unless-stopped
    command: ["./bundle_status_service"]

  jito-fee-service:
    build:
      context: ..
      dockerfile: bundle_status_service/Dockerfile
    container_name: jito-fee-service
    networks:
      bundle_status_net:
        ipv4_address: 10.0.1.31
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis-master:6379
    depends_on:
      - redis-master
    restart: unless-stopped
    command: ["./jito_fee_service"]
