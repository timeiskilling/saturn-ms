[package]
name = "bundle_status_service"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
rand = "0.9.2"

common = { path = "../common" }
config = {path = "../config"}
jupiter_trader_data = {path = "../jupiter_trader_data"}
proto_models = {path = "../proto_models"}
saturn_errors = { path = "../saturn_errors" }

jito-sdk-rust = "0.3.2"
dashmap = "6.1.0"

tokio = { version = "1.47.1", features = ["full", "macros"] }
tokio-util = "0.7.18"
async-trait = "0.1.89"

redis = { version = "1.0", features = ["tokio-comp", "json", "sentinel","streams"] }
deadpool-redis = {version = "0.23.0", features = ["sentinel", "rt_tokio_1"]}

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.41", features = ["serde"] }

reqwest = { version = "0.12.24", features = ["json"] }
governor = "0.10.2"

solana-client = "3.1.9"
solana-sdk = "4.0.1"
solana-commitment-config = "3.1.1"
solana-system-interface = { version = "3.1.0", features = ["bincode"] }

bincode = "1.3.3"
base64 = "0.22.0"
bs58 = "0.5.1"
borsh = "1.5.7"
borsh-derive = "1.5.7"

tonic = "0.14.1"
prost = "0.14.1"
tonic-prost = "0.14.1"
tokio-stream = { version = "0.1.17", features = ["sync"] }

tonic-web = "0.14.1"
tonic-health = "0.14.1"

tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace", "cors"]}

anyhow = "1.0"
