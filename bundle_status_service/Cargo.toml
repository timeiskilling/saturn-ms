[package]
name = "bundle_status_service"
version = "0.1.0"
edition = "2024"

[dependencies]
# axum = { version = "0.8.4", features = ["http2", "tokio","macros","ws"] }
# axum-server = { version = "0.7.2", features = ["tls-rustls"] }
# axum-extra = { version = "0.12.2", features = ["typed-header"] }
# hyper = { version = "1.8.1", features = ["full"] }
# hyper-util = { version = "0.1.18", features = ["full"] }

pin-project = "1"

common = { path = "../common" }
config = {path = "../config"}
jupiter_trader_data = {path = "../jupiter_trader_data"}
proto_models = {path = "../proto_models"}

jito-sdk-rust = "0.3.2" 
dashmap = "6.1.0"
tokio = { version = "1.47.1", features = ["full", "macros"] }
redis = { version = "0.32.5", features = ["tokio-comp", "json"] } 
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.41", features = ["serde"] }

reqwest = { version = "0.12.24", features = ["json"] }
governor = "0.10.2"

solana-client = "2.3.7"
solana-sdk = "2.3.1"

solana-system-interface = "2.0.0"

bincode = "1.3.3"
base64 = "0.22.0"
bs58 = "0.5.1"  
borsh = "1.5.7"
borsh-derive = "1.5.7"

tonic = "0.14.1"
prost = "0.14.1"
tonic-prost = "0.14.1"
tokio-stream = { version = "0.1.17", features = ["sync"] }

tonic-web = "0.14.1"
tonic-health = "0.14.1"

tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace", "cors"]} 

anyhow = "1.0"