global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    timeout connect 5s
    timeout client  30s
    timeout server  30s

#--------------------------------------------------
# Stats
#--------------------------------------------------
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    acl local_network src 127.0.0.1
    http-request deny unless local_network

#--------------------------------------------------
# HTTP → HTTPS
#--------------------------------------------------
frontend http_front
    bind *:80
    redirect scheme https code 301

#--------------------------------------------------
# HTTPS
#--------------------------------------------------
frontend https_front
    bind *:443 ssl crt /etc/haproxy/certs/bundle.pem alpn h2,http/1.1

    acl is_grpc  path_beg /streaming.BundleService/
    acl is_grpc  path_beg /grpc.health.v1.Health/  # gRPC health check

    acl is_session  path_beg /auth /wallet /device /bundles
    
    use_backend grpc_back     if is_grpc
    use_backend session_back  if is_session

    default_backend frontend_back
    
#--------------------------------------------------
# Backends
#--------------------------------------------------

# gRPC-Web (Tonic — вже має tonic_web + CORS)
backend grpc_back
    mode http
    option http-server-close
    server bundle_status 10.0.0.32:3000 check

# REST — user-session-manager
backend session_back
    mode http
    option http-server-close
    server user_session 10.0.0.21:3001 check

# REST — saturn-bundle-tracker
backend tracker_back
    mode http
    option http-server-close
    option httpchk GET /health
    server tracker 10.0.0.30:3001 check

# React SPA — saturn-trader
backend frontend_back
    mode http
    option http-server-close
    server frontend 10.0.0.31:3030 check
