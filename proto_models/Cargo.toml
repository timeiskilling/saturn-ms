[package]
name = "proto_models"
version = "0.1.0"
edition = "2024"

[dependencies]
tonic = "0.14.1"
prost = "0.14.1"
tokio = { version = "1.45.1", features = ["full", "macros"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tonic-prost = "0.14.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22.0"  
bincode = "1.3.3"


[build-dependencies]
tonic-prost-build = "0.14.1"
