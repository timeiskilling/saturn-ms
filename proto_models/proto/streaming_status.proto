syntax = "proto3";

package streaming;

service BundleService {
  // rpc GetStatusesStream (AddBundlesRequest) returns (stream UserBundleUpdate) {};
  // rpc CoinsInformation (Empty) returns (stream CoinsData) {};
  // rpc UserPubK (UserPk) returns (Response);
  rpc CreateTransactions(TransactionsBuld) returns (TransactionsToSign) {}
  rpc SendTransactions(SignedTransactions) returns (stream UserBundleUpdate) {}
  rpc SubscribeToBundles(UserBundleRequest) returns (stream UserBundleUpdate) {}
}
