    ports:
      - "16382:6379"
    volumes:
      - stress_redis_4:/data
    restart: no
    command: redis-server --save "" --appendonly no

  # Node 5 (Port 16383)
  redis_stress_5:
    image: redis:7-alpine
    container_name: stress_redis_5
