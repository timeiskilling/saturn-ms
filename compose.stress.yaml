services:
  # Node 1 (Port 16379)
  redis_stress_1:
    image: redis:7-alpine
    container_name: stress_redis_1
    ports:
      - "16379:6379"
    volumes:
      - stress_redis_1:/data
    restart: no
    command: redis-server --save "" --appendonly no

  # Node 2 (Port 16380)
  redis_stress_2:
    image: redis:7-alpine
    container_name: stress_redis_2
    ports:
      - "16380:6379"
    volumes:
      - stress_redis_2:/data
    restart: no
    command: redis-server --save "" --appendonly no

  # Node 3 (Port 16381)
  redis_stress_3:
    image: redis:7-alpine
