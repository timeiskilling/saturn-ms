      - "16383:6379"
    volumes:
      - stress_redis_5:/data
    restart: no
    command: redis-server --save "" --appendonly no

volumes:
  stress_redis_1:
  stress_redis_2:
  stress_redis_3:
  stress_redis_4:
  stress_redis_5:
