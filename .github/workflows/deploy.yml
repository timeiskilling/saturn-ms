name: CI/CD Saturn Platform

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}/saturn

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-session-manager
            context: .
            dockerfile: user_session_manager/Dockerfile
            is_frontend: false

          - service: saturn-bundle-tracker
            context: .
            dockerfile: saturn-bundle-tracker/Dockerfile
            is_frontend: false

          - service: bundle-status-service
            context: .
            dockerfile: bundle_status_service/Dockerfile
            is_frontend: false

          - service: jito-tip-service
            context: .
            dockerfile: jito_fee_service/Dockerfile
            is_frontend: false

          - service: price-service
            context: .
            dockerfile: price_service/Dockerfile
            is_frontend: false

          - service: saturn-trader
            context: ./saturn-trader
            dockerfile: ./saturn-trader/Dockerfile
            is_frontend: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ${{ matrix.is_frontend && format('VITE_PRICE_SERVICE_URL={0}', secrets.VITE_PRICE_SERVICE_URL) || '' }}
            ${{ matrix.is_frontend && format('VITE_SESSION_URL={0}', secrets.VITE_SESSION_URL) || '' }}
            ${{ matrix.is_frontend && format('VITE_GRPC_URL={0}', secrets.VITE_GRPC_URL) || '' }}
