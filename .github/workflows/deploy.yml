name: CI/CD Saturn Platform
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: ${{ github.repository_owner }}/saturn

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-session-manager
            context: .
            dockerfile: user_session_manager/Dockerfile
            paths: user_session_manager
            is_frontend: false

          - service: saturn-bundle-tracker
            context: .
            dockerfile: saturn-bundle-tracker/Dockerfile
            paths: saturn-bundle-tracker
            is_frontend: false

          - service: bundle-status-service
            context: .
            dockerfile: bundle_status_service/Dockerfile
            paths: bundle_status_service
            is_frontend: false
            bin_name: bundle_status_service

          - service: bundle-status-service-mock
            context: .
            dockerfile: bundle_status_service/Dockerfile
            paths: bundle_status_service
            is_frontend: false
            bin_name: mock_service

          - service: jito-tip-service
            context: .
            dockerfile: jito_fee_service/Dockerfile
            paths: jito_fee_service
            is_frontend: false

          - service: price-service
            context: .
            dockerfile: price_service/Dockerfile
            paths: price_service
            is_frontend: false

          - service: bun_price_service
            context: ./bun_price_service
            dockerfile: ./bun_price_service/Dockerfile
            paths: bun_price_service
            is_frontend: false

          - service: saturn-trader
            context: ./saturn-trader
            dockerfile: ./saturn-trader/Dockerfile
            paths: saturn-trader
            is_frontend: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if service changed
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "^${{ matrix.paths }}/\|^\.cargo/config\.toml$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.changes.outputs.changed == 'true'

      - uses: docker/login-action@v3
        if: steps.changes.outputs.changed == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        if: steps.changes.outputs.changed == 'true'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BIN_NAME=${{ matrix.bin_name }}
            VITE_PRICE_SERVICE_URL=${{ secrets.VITE_PRICE_SERVICE_URL }}
            VITE_SESSION_URL=${{ secrets.VITE_SESSION_URL }}
            VITE_GRPC_URL=${{ secrets.VITE_GRPC_URL }}
            VITE_HELIUS_API_KEY=${{ secrets.VITE_HELIUS_API_KEY }}
