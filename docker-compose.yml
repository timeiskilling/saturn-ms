# -----------------------------------------------------------------------------
# Unified Redis Sentinel Cluster & Microservices for Saturn
# -----------------------------------------------------------------------------
# Provides 1 Master, 1 Replica, and 3 Sentinels using the specific IPs requested.
# All microservices connect to this central highly-available cache layer.
#
# Environment Variable Setup for local development (not via Docker):
# USER_MANAGER_SENTINEL_URLS=redis://127.0.0.1:26379,redis://127.0.0.1:26380,redis://127.0.0.1:26381
# -----------------------------------------------------------------------------

networks:
  saturn_redis_net:
    ipam:
      driver: default
      config:
        - subnet: "10.0.0.0/24"
          gateway: "10.0.0.254"

services:
  # =========================================================
  # INFRASTRUCTURE
  # =========================================================

  haproxy:
    image: haproxy:latest
    container_name: saturn-haproxy
    networks:
      saturn_redis_net:
        ipv4_address: 10.0.0.5
    ports:
      - "80:80"
      - "443:443"
      # - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/etc/haproxy/certs:ro
    depends_on:
      - user-session-manager
      - saturn-bundle-tracker
      - bundle_status_service
      - price_service
      - saturn-trader

  redis-master:
    image: bitnami/redis:latest
    container_name: redis-master
    environment:
      - REDIS_REPLICATION_MODE=master
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      saturn_redis_net:
        ipv4_address: 10.0.0.10

  redis-replica:
    image: bitnami/redis:latest
    container_name: redis-replica
    environment:
      - REDIS_REPLICATION_MODE=slave
      - REDIS_MASTER_HOST=10.0.0.10
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      saturn_redis_net:
        ipv4_address: 10.0.0.11
    depends_on:
      - redis-master

  redis-sentinel-1:
    image: bitnami/redis-sentinel:latest
    container_name: redis-sentinel-1
    environment:
      - REDIS_MASTER_HOST=10.0.0.10
      - REDIS_MASTER_SET=mymaster
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=5000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=10000
    networks:
      saturn_redis_net:
        ipv4_address: 10.0.0.1
    depends_on:
      - redis-master
      - redis-replica

  redis-sentinel-2:
    image: bitnami/redis-sentinel:latest
    container_name: redis-sentinel-2
    environment:
      - REDIS_MASTER_HOST=10.0.0.10
      - REDIS_MASTER_SET=mymaster
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=5000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=10000
    networks:
      saturn_redis_net:
        ipv4_address: 10.0.0.2
    depends_on:
      - redis-master
      - redis-replica

  redis-sentinel-3:
    image: bitnami/redis-sentinel:latest
    container_name: redis-sentinel-3
    environment:
      - REDIS_MASTER_HOST=10.0.0.10
      - REDIS_MASTER_SET=mymaster
      - REDIS_SENTINEL_QUORUM=2
      - REDIS_SENTINEL_DOWN_AFTER_MILLISECONDS=5000
      - REDIS_SENTINEL_FAILOVER_TIMEOUT=10000
    networks:
      saturn_redis_net:
        ipv4_address: 10.0.0.3
    depends_on:
      - redis-master
      - redis-replica

  postgres:
    image: postgres:15
    container_name: saturn-postgres
    env_file:
      - .env
    networks:
      saturn_redis_net:
        ipv4_address: 10.0.0.20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # =========================================================
  # MICROSERVICES
  # =========================================================

  user-session-manager:
    build:
      context: .
      dockerfile: user_session_manager/Dockerfile
    container_name: user-session-manager
    networks:
      saturn_redis_net:
        ipv4_address: 10.0.0.21
    env_file:
      - .env
    environment:
      # Connects using Sentinel Pool native to deadpool_redis
      - USER_MANAGER_SENTINEL_URLS=redis://10.0.0.1:26379,redis://10.0.0.2:26379,redis://10.0.0.3:26379
      - USER_MANAGER_SENTINEL_MASTER_NAME=mymaster
      - POSTGRES_HOST=10.0.0.20
    depends_on:
      - postgres
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3

  saturn-bundle-tracker:
    build:
      context: .
      dockerfile: saturn-bundle-tracker/Dockerfile
    container_name: saturn-bundle-tracker
    networks:
      saturn_redis_net:
        ipv4_address: 10.0.0.30
    env_file:
      - .env
    environment:
      # Connects using Sentinel Pool
      - REDIS_SENTINEL_URLS=redis://10.0.0.1:26379,redis://10.0.0.2:26379,redis://10.0.0.3:26379
      - REDIS_MASTER_SET=mymaster
      - NOTIFICATION_SENTINEL_URLS=redis://10.0.0.1:26379,redis://10.0.0.2:26379,redis://10.0.0.3:26379
      - NOTIFICATION_SENTINEL_MASTER_NAME=mymaster
      - JITO_API_URL=https://frankfurt.mainnet.block-engine.jito.wtf/api/v1
    depends_on:
      - redis-sentinel-1
      - redis-sentinel-2
      - redis-sentinel-3

  bundle_status_service:
    build:
      context: .
      dockerfile: bundle_status_service/Dockerfile
    container_name: bundle_status_service
    networks:
      saturn_redis_net:
        ipv4_address: 10.0.0.32
    env_file:
      - .env
    environment:
      # Uses raw multiplexed async connection (Points to Master directly)
      - REDIS_HOST=10.0.0.10
      - REDIS_PORT=6379
      - JITO_TIP_REDIS_HOST=10.0.0.10
      - JITO_TIP_REDIS_PORT=6379
      - NOTIFICATION_REDIS_HOST=10.0.0.10
      - NOTIFICATION_REDIS_PORT=6379
      - RUST_BACKTRACE=1
    depends_on:
      - redis-master

  jito_tip_service:
    build:
      context: .
      dockerfile: jito_fee_service/Dockerfile
    container_name: jito_tip_service
    networks:
      saturn_redis_net:
        ipv4_address: 10.0.0.33
    env_file:
      - .env
    environment:
      # Uses raw multiplexed async connection (Points to Master directly)
      - REDIS_URL=redis://10.0.0.10:6379
      - JITO_TIP_REDIS_HOST=10.0.0.10
      - JITO_TIP_REDIS_PORT=6379
      - RUST_BACKTRACE=1
    depends_on:
      - redis-master

  price_service:
    build:
      context: .
      dockerfile: price_service/Dockerfile
    container_name: price_service
    networks:
      saturn_redis_net:
        ipv4_address: 10.0.0.34
    env_file:
      - .env
    environment:
      # Uses raw multiplexed async connection (Points to Master directly)
      - PRICE_REDIS_HOST=10.0.0.10
      - PRICE_REDIS_PORT=6379
      - RUST_BACKTRACE=1
    depends_on:
      - redis-master

  saturn-trader:
    build:
      context: ./saturn-trader
      dockerfile: Dockerfile
      args:
        - VITE_PRICE_SERVICE_URL=https://my-domain.com
        - VITE_SESSION_URL=https://my-domain.com
        - VITE_GRPC_URL=https://my-domain.com

    container_name: saturn-trader
    networks:
      saturn_redis_net:
        ipv4_address: 10.0.0.31
    env_file:
      - .env
    environment:
      # Uses standard ioredis connection (Points to Master directly)
      - REDIS_HOST=10.0.0.10
      - REDIS_PORT=6379
    depends_on:
      - redis-master

volumes:
  postgres_data:
