[package]
name = "user_session_manager"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.0"

common = { path = "../common" }
config = {path = "../config"}
saturn_errors = { path = "../saturn_errors" }
tokio = { version = "1.47.1", features = ["full", "macros"] }
redis = { version = "1.0", features = ["tokio-comp", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.41", features = ["serde"] }

reqwest = { version = "0.12.24", features = ["json","cookies"] }
governor = "0.10.2"
solana-sdk = "4.0.1"

tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace", "cors"]}

bincode = "1.3.3"
base64 = "0.22.0"
bs58 = "0.5.1"

axum = { version = "0.8.8", features = ["http2", "tokio", "macros"] }
axum-extra = { version = "0.12.5", features = ["cookie","typed-header"] }
uuid = { version = "1.21.0", features = ["v4"] }
deadpool-redis = {version = "0.23.0", features = ["sentinel", "rt_tokio_1"]}
time = "0.3.47"

sqlx = { version = "0.8.6", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "json",
    "chrono",
    "macros"
] }
tower_governor = "0.8.0"
sha2 = "0.11.0"
hex = "0.4.3"
