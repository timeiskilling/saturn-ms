[package]
name = "user_session_manager"
version = "0.1.0"
edition = "2024"

[dependencies]

common = { path = "../common" }
config = {path = "../config"}
saturn_errors = { path = "../saturn_errors" }
tokio = { version = "1.47.1", features = ["full", "macros"] }
redis = { version = "1.0", features = ["tokio-comp", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.41", features = ["serde"] }

reqwest = { version = "0.12.24", features = ["json"] }
governor = "0.10.2"
solana-sdk = "4.0.1"

tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["trace", "cors"]}

bincode = "1.3.3"
base64 = "0.22.0"
bs58 = "0.5.1"
