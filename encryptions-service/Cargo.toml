[package]
name = "encryptions-service"
version = "0.1.0"
edition = "2024" 

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "encryptions-service"
path = "src/main.rs"


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]

argon2 = { version = "0.5.3", features = ["password-hash"] }
chacha20poly1305 = "0.10.1"
bip39 = "2.2.0"
zeroize = "1.8.2"
hmac = "0.12.1"
sha2 = "0.10.9"
governor = "0.10.2"
helius_data = { path = "../helius_data" }
wallet_models = { path = "../wallet_models" }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1.89"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
base64 = "0.22.0"
bs58 = "0.5.1"
tracing = "0.1"


solana-sdk = "2.3.0"
solana-account-decoder = "2.3.7"
spl-token = "8.0.0"
spl-token-interface = "1.0.0"


web-time = "1.1.0"


# [target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
js-sys = "0.3.83"
tracing-wasm = "0.2.1"
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
async-lock = "3.4.1"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
web-sys = { version = "0.3.83", features = [
    "Window", "Request", "RequestInit", "RequestMode", "Response", "Headers", "console"
] }
futures = "0.3"
reqwest = { version = "0.12.23", features = ["json", "default-tls"] }
tsify = "0.5.6"

# [target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.48.0", features = ["full"] }
# reqwest = { version = "0.12.26", features = ["json"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
solana-client = "2.3.7"